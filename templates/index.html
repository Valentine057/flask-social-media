{% extends '_base.html' %}

{% block page_body %}
<div class="video-page-wrapper">
    <div class="video-card">
        <video id="main-player" autoplay loop muted playsinline>
            <source src="" type="video/mp4">
        </video>
        <img id="main-image" src="" style="display: none;">

        <div class="video-overlay-info">
            <h3>@{{ current_user.first_name if current_user else 'Guest' }}</h3>
            <p id="status-text">#ClassProject #Flask #Coding</p>
        </div>
    </div>

    <div id="comment-panel" class="comment-panel" style="display: none;">
    <div class="comment-header">Comments</div>
    <div id="comment-list" class="comment-list"></div>
    <input type="text" id="comment-input" placeholder="Add a comment...">
</div>

<div id="heart-icon" class="heart-icon">❤️</div>

    <button id="upload-btn">➕ Post</button>
    <input type="file" id="file-selector" style="display: none;" accept="video/*,image/*">
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
{% endblock %}
